# hermes profile 'orchestrator' (~/.hermes/profiles/orchestrator/config.yaml), trimmed to the parts we changed or rely on.
# secrets live in the profile's .env, not here. everything else is hermes defaults.

model:
  # Default model to use (can be overridden with --model flag)
  # Both "default" and "model" work as the key name here.
  default: "gpt-oss:120b"

  # Inference provider selection:
  #   "auto"         - Auto-detect from credentials (default)
  #   "openrouter"   - OpenRouter (requires: OPENROUTER_API_KEY or OPENAI_API_KEY)
  #   "nous"         - Nous Portal OAuth (requires: <redacted>
  #   "nous-api"     - Nous Portal API key (requires: <redacted>
  #   "anthropic"    - Direct Anthropic API (requires: ANTHROPIC_API_KEY)
  #   "openai-codex" - OpenAI Codex (requires: hermes auth)
  #   "copilot"      - GitHub Copilot / GitHub Models (requires: GITHUB_TOKEN)
  #   "gemini"      - Use Google AI Studio direct (requires: GOOGLE_API_KEY or GEMINI_API_KEY)
  #   "zai"         - Use z.ai / ZhipuAI GLM models (requires: GLM_API_KEY)
  #   "kimi-coding"  - Kimi / Moonshot AI (requires: KIMI_API_KEY)
  #   "minimax"      - MiniMax global (requires: MINIMAX_API_KEY)
  #   "minimax-cn"   - MiniMax China (requires: MINIMAX_CN_API_KEY)
  #   "huggingface"  - Hugging Face Inference (requires: HF_TOKEN)
  #   "nvidia"       - NVIDIA NIM / build.nvidia.com (requires: NVIDIA_API_KEY)
  #   "xiaomi"       - Xiaomi MiMo (requires: XIAOMI_API_KEY)
  #   "arcee"        - Arcee AI Trinity models (requires: ARCEEAI_API_KEY)
  #   "ollama-cloud" - Ollama Cloud (requires: OLLAMA_API_KEY — https://ollama.com/settings)
  #   "deepinfra"    - DeepInfra (requires: DEEPINFRA_API_KEY)
  #   "kilocode"     - KiloCode gateway (requires: KILOCODE_API_KEY)
  #   "ai-gateway"   - Vercel AI Gateway (requires: AI_GATEWAY_API_KEY)
  #   "azure-foundry" - Microsoft Foundry / Azure OpenAI (API key or Entra ID)
  #   "lmstudio"     - LM Studio local server (optional: LM_API_KEY, defaults to http://127.0.0.1:1234/v1)
  #
  # Local servers (LM Studio, Ollama, vLLM, llama.cpp):
  #   "custom"       - Any other OpenAI-compatible endpoint. Set base_url below.
  #   Aliases: "ollama", "vllm", "llamacpp" all map to "custom".
  #   LM Studio is first-class and uses provider: "lmstudio".
  #   It works with both no-auth and auth-enabled server modes.
  #
  # Can also be overridden for a single invocation with the --provider flag.
  provider: "ollama-cloud"

  # API configuration (falls back to OPENROUTER_API_KEY env var)
  # api_key: <redacted>
  base_url: "https://ollama.com/v1"

  # Stream API responses from the provider (default: true). The agent core
  # prefers streaming for every turn — subagents included — for liveness
  # health-checking. Set false to force non-streaming requests for the whole
  # session (persists across mid-session model switches). Escape hatch for
  # self-hosted OpenAI-compatible servers whose streaming tool-call path is
  # broken (e.g. vLLM with --tool-call-parser qwen3_xml + a reasoning parser
  # can leak tool calls into plain text instead of returning tool_calls —
  # #72901). Orthogonal to display.streaming, which controls token rendering
  # only.
  # streaming: true

  # Azure Foundry keyless auth example:
  # provider: "azure-foundry"
  # base_url: "https://<resource>.openai.azure.com/openai/v1"
  # auth_mode: <redacted>
  # default: "gpt-4o"          # Deployment/model name
  # entra:
  #   scope: "https://ai.azure.com/.default"  # Optional; this is the default.

  # ── Token limits — two settings, easy to confuse ──────────────────────────
  #
  # context_length: TOTAL context window (input + output tokens combined).
  #   Controls when Hermes compresses history and validates requests.
  #   Leave unset — Hermes auto-detects the correct value from the provider.
  #   Set manually only when auto-detection is wrong (e.g. a local server with
  #   a custom num_ctx, or a proxy that doesn't expose /v1/models).
  #
  # context_length: 131072
  #
  # ollama_num_ctx: Ollama only — the num_ctx sent on every chat request.
  #   Hermes auto-detects the model's window and sends it (Ollama otherwise
  #   defaults to 2048); context_length, if set, caps the detected value.
  #   An explicit ollama_num_ctx is sent as-is (never capped) — set it to
  #   pin VRAM use.
  #
  # ollama_num_ctx: 32768
  #
  # Output-token limits are provider-owned, not user configuration. Native
  # protocols requiring a limit receive an internal value from Hermes.

  # ── Custom request headers (optional) ─────────────────────────────────────
  #
  # default_headers: extra HTTP headers sent on every request to an
  #   OpenAI-compatible endpoint. User values take precedence over the
  #   provider/SDK defaults, so this is the supported way to override the
  #   OpenAI Python SDK's identifying headers (User-Agent: OpenAI/Python ...,
  #   X-Stainless-*) when a custom provider sits behind a gateway/WAF that
  #   rejects them — e.g. an upstream that returns "502 Upstream access
  #   forbidden" for the SDK default User-Agent but accepts a plain one.
  #   Applies on the OpenAI wire only (not native Anthropic / Bedrock).
  #
  # default_headers:
  #   User-Agent: "curl/8.7.1"
  #
  # extra_headers: accepted as an alias of default_headers (merged, with
  #   extra_headers winning when both are set) — matches the per-provider
  #   extra_headers key below.
  #
  # Per-provider variant: named providers / custom_providers entries accept an
  # extra_headers dict scoped to that endpoint only — for reverse proxies,
  # gateways, or custom auth (e.g. Cloudflare Access service tokens).
  # Merged onto SDK/provider defaults with the entry's values winning.
  # Header values are treated as secrets and are never logged.
  #
  # providers:
  #   my-proxy:
  #     base_url: "https://llm.internal.example.com/v1"
  #     key_env: <redacted>
  #     extra_headers:
  #       CF-Access-Client-Id: "xxxx.access"
  #       CF-Access-Client-Secret: <redacted>
  #       X-Client-Name: "hermes-agent"
  #
  # session_affinity_header: NAME of a header that carries Hermes' conversation
  # id on every request to that provider (all api_modes + auxiliary calls). Off
  # unless set. For session-aware proxies that otherwise treat each agent-loop
  # request as a new conversation and replay the whole history upstream.
  #
  # providers:
  #   my-proxy:
  #     base_url: "http://127.0.0.1:4000/v1"
  #     session_affinity_header: x-litellm-session-id
# providers:
#   meta:
#     base_url: https://api.meta.ai/v1
#     api_key: <redacted>
#     # api_mode auto-detected as codex_responses for api.meta.ai; no need to set
#     # (the bundled meta-ai provider covers this — a named custom provider is
#     # only needed for a non-default Meta-compatible endpoint)
# Fast/priority tier behind an OpenAI-compatible gateway or proxy: agent.service_tier
# (`/fast`) only reaches first-party endpoints; ask a gateway for its own tier via
# extra_body, which is merged into every request routed to that provider.
# providers:
#   my-gateway:
#     base_url: https://gateway.example.com/v1
#     api_key: <redacted>
#     extra_body:
#       service_tier: priority   # whatever tier value your gateway documents
# providers:
#   router:
#     base_url: https://api.router.com/v1
#     api_key: <redacted>
#     # api_mode auto-detected as codex_responses for api.router.com — the
#     # Responses API is Router's native wire (chat/completions is only a
#     # compatibility shim). The bundled router provider covers this; a named
#     # custom provider is only needed for a non-default Router-compatible
#     # endpoint.


# Command-minted credentials (optional): key_cmd
# ------------------------------------------------------------------
# Enterprise gateways often issue SHORT-LIVED bearers (SSO/OIDC brokers, cloud
# IAM, internal auth proxies) rather than static API keys, so a value copied
# into .env via `key_env` is stale within the hour and every later request 401s.
# `key_cmd` names a command that PRINTS a token instead: <redacted>
# request (cached until shortly before expiry), so long sessions keep working
# with no restart.
#
# Contract: print ONLY the token on stdout, either bare or as JSON with an
# "access_token" field ("expires_in" is honoured). Same shape as OAuth 2.0
# token endpoints, Claude Code's `apiKeyHelper`, `gcloud auth
# print-access-token`, and `aws ecr get-login-password`.
#
# Precedence: an explicit --api-key still wins; otherwise key_cmd is preferred
# over inline api_key / key_env on that entry.
#
# Applies to the main agent turn and to auxiliary tasks (title generation,
# context compression, vision, embedding) alike.
#
# Not to be confused with `secrets.command`, which is a different mechanism:
# that one runs a helper ONCE at startup to populate env vars for many secrets
# at the process level. Use it for a vault or keychain helper that hands back a
# KEY=VALUE blob. Use `key_cmd` when ONE provider needs a credential refreshed
# DURING a session, because a startup-time env var cannot be re-minted after it
# expires.
#
# providers:
#   my-gateway:
#     base_url: "https://gateway.internal.example.com/v1"
#     api_mode: chat_completions
#     key_cmd: <redacted>
#
# Worked example — an AI gateway that routes by model family, so one entry per
# wire format shares the same credential helper:
#
# providers:
#   dbx:                             # OpenAI-compatible (MLflow) route
#     base_url: "https://<workspace>.cloud.databricks.com/ai-gateway/mlflow/v1"
#     api_mode: chat_completions
#     model: databricks-claude-sonnet-4-6
#     key_cmd: <redacted>
#   dbx-gpt:                         # OpenAI Responses route
#     base_url: "https://<workspace>.cloud.databricks.com/ai-gateway/openai/v1"
#     api_mode: codex_responses
#     model: databricks-gpt-5-5
#     key_cmd: <redacted>
#   dbx-claude:                      # Anthropic Messages route
#     base_url: "https://<workspace>.cloud.databricks.com/ai-gateway/anthropic"
#     api_mode: anthropic_messages
#     model: databricks-claude-fable-5
#     key_cmd: <redacted>

# Named provider overrides (optional)
# Use this for per-provider request timeouts, non-stream stale timeouts,
# and per-model exceptions.
# Applies to the primary turn client on every api_mode (OpenAI-wire, native
# Anthropic, and Anthropic-compatible providers), the fallback chain, and
# client rebuilds during credential rotation.  For OpenAI-wire chat
# completions (streaming and non-streaming) the configured value is also
# used as the per-request ``timeout=`` kwarg so it wins over the legacy
# HERMES_API_TIMEOUT env var (which still applies when no config is set).
# ``stale_timeout_seconds`` controls the non-streaming stale-call detector and
# wins over the legacy HERMES_API_CALL_STALE_TIMEOUT env var. Leaving these
# unset keeps the legacy defaults (HERMES_API_TIMEOUT=1800s,
# HERMES_API_CALL_STALE_TIMEOUT=90s, native Anthropic 900s). The
# implicit non-stream stale detector is auto-disabled for local endpoints
# and can scale upward for very large contexts.
#
# Not currently wired for AWS Bedrock (bedrock_converse + AnthropicBedrock
# SDK paths) — those use boto3 with its own timeout configuration.
#
# providers:
#   ollama-local:
#     request_timeout_seconds: 300   # Longer timeout for local cold-starts
#     stale_timeout_seconds: 900     # Explicitly re-enable stale detection on local endpoints
#   anthropic:
#     request_timeout_seconds: 30    # Fast-fail cloud requests
#     models:
#       claude-opus-4.6:
#         timeout_seconds: 600       # Longer timeout for extended-thinking Opus calls
#   openai-codex:
#     models:
#       gpt-5.4:
#         stale_timeout_seconds: 1800  # Longer non-stream stale timeout for slow large-context turns

# =============================================================================
# Unified Timeouts (operation deadlines)
# =============================================================================
# One place to override Hermes's internal operation deadlines (seconds).
# Keys are dotted paths resolved by agent/deadline.py: <redacted>
# Precedence: this section > legacy HERMES_* env var (back-compat) > built-in
# default. 0 or a negative value disables the bound (unbounded); very large
# values are clamped to a platform-safe maximum automatically.
#
# Currently resolved keys (more paths migrate here over time — see issue #85125):
#
# timeouts:
#   tools:
#     concurrent_batch: 420   # Deadline for a parallel tool-call batch
#                             # (legacy env: HERMES_CONCURRENT_TOOL_TIMEOUT_S)
#     sequential_call: 420    # Deadline for one sequentially-executed tool call.
#                             # Defaults to concurrent_batch's value so the two
#                             # executor paths stay in sync; human waits
#                             # (approval prompts, clarify) never count against it.

# =============================================================================
# OpenRouter Provider Routing (only applies when using OpenRouter)
# =============================================================================
# Control how requests are routed across providers on OpenRouter.
# See: https://openrouter.ai/docs/guides/routing/provider-selection
#
# provider_routing:
#   # Sort strategy: "price" (default), "throughput", or "latency"
#   # Append :nitro to model name for a shortcut to throughput sorting.
#   sort: "throughput"
#
#   # Only allow these providers (provider slugs from OpenRouter)
#   # only: ["anthropic", "google"]
#
#   # Skip these providers entirely
#   # ignore: ["deepinfra", "fireworks"]
#
#   # Try providers in this order (overrides default load balancing)
#   # order: ["anthropic", "google", "together"]
#
#   # Require providers to support all parameters in your request
#   # require_parameters: true
#
#   # Data policy: "allow" (default) or "deny" to exclude providers that may store data
#   # data_collection: "deny"
#
#   # Per-model overrides: same keys, applied only when the agent is on that model
#   # (spelling-tolerant match; unset keys fall through to the flat values above).
#   # models:
#   #   "openai/gpt-6-astra":
#   #     only: ["openai"]
#   #   "anthropic/claude-fable-5.1":
#   #     only: ["anthropic"]

# =============================================================================
# OpenRouter Response Caching (only applies when using OpenRouter)
# =============================================================================
# Cache identical API responses at the OpenRouter edge for free instant replays.
# When enabled, identical requests (same model, messages, parameters) return
# cached responses with zero billing. Separate from Anthropic prompt caching.
# See: https://openrouter.ai/docs/guides/features/response-caching
#
# openrouter:
#   response_cache: true         # Enable response caching (default: true)
#   response_cache_ttl: 300      # Cache TTL in seconds, 1-86400 (default: 300)

# =============================================================================
# Git Worktree Isolation
# =============================================================================
# When enabled, each CLI session creates an isolated git worktree so multiple
# agents can work on the same repo concurrently without file collisions.
# Equivalent to always passing --worktree / -w on the command line.
#
# worktree: true    # Always create a worktree when in a git repo
# worktree: false   # Default — only create when -w flag is passed
#
# By default a new worktree branches from the freshly-fetched remote tip
# (the current branch's upstream, else the remote's default branch) so it
# starts current with the project instead of from the local clone's
# (possibly stale) HEAD. Set worktree_sync: false to branch from local HEAD
# instead — useful when offline or when you deliberately want the clone's
# exact current state as the base.
#
# worktree_sync: true   # Default — branch from the fetched remote tip
# worktree_sync: false  # Branch from local HEAD (offline / pinned base)

# =============================================================================
# Kanban Review Dispatch
# =============================================================================
# First-class review tasks are dispatched automatically by default. The worker
# is spawned with the bundled sdlc-review skill and can approve, request changes
# back to the original implementer, or escalate a genuine external blocker.
# Disable this only when every review is performed manually from the dashboard.
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

# =============================================================================
# Context Compression (Auto-shrinks long conversations)
# =============================================================================
# When conversation approaches model's context limit, middle turns are
# automatically summarized to free up space while preserving important context.
#
# HOW IT WORKS:
# 1. Tracks actual token usage from API responses (not estimates)
# 2. When prompt_tokens >= threshold% of model's context_length, triggers compression
# 3. Protects first 3 turns (system prompt, initial request, first response)
# 4. Protects last N turns (default 20 messages = ~10 full turns of recent context)
# 5. Summarizes middle turns using a fast/cheap model
# 6. Inserts summary as a user message, continues conversation seamlessly
#
# Post-compression tail budget is target_ratio × threshold × context_length:
#   200K context, threshold 0.50, ratio 0.20 → 20K tokens of recent tail preserved
#   1M   context, threshold 0.50, ratio 0.20 → 100K tokens of recent tail preserved
#
skills:
  # Nudge the agent to create skills after complex tasks.
  # Every N tool-calling iterations, remind the model to consider saving a skill.
  # Set to 0 to disable.
  creation_nudge_interval: 15

  # External skill directories — share skills across tools/agents without
  # copying them into ~/.hermes/skills/.  Each path is expanded (~ and ${VAR})
  # and resolved to an absolute path.  External dirs are read-only: skill
  # creation always writes to ~/.hermes/skills/.  Local skills take precedence
  # when names collide.
  # external_dirs:
  #   - ~/.agents/skills
  #   - /home/shared/team-skills

# =============================================================================
# Agent Behavior
# =============================================================================
agent:
  # Maximum tool-calling iterations per conversation (default: 500)
  # Higher = more room for complex tasks, but costs more tokens
  # Recommended: 20-30 for focused tasks, 50-100 for open exploration
  max_turns: 500

  # Inactivity timeout for gateway agent runs (seconds, 0 = unlimited).
  # The agent can run indefinitely when actively calling tools or receiving
  # API responses.  Only fires after the agent has been idle for this duration.
  # gateway_timeout: 1800

  # Maximum time an alias routing key waits for an active turn holding the same
  # resolved session lease. On expiry Hermes rejects this inbound message and
  # asks the user to resend rather than running it without serialization.
  # Non-positive values fall back to the 5-second default.
  # gateway_turn_lease_timeout: 5

  # Staged warning: send a warning before escalating to full timeout.
  # Fires once per run when inactivity reaches this threshold (seconds).
  # Set to 0 to disable the warning.
  # gateway_timeout_warning: 900

  # Session stall watchdog (seconds). When a busy session has a pending
  # inbound follow-up and the agent activity clock is idle this long, the
  # gateway logs a WARNING and notifies the user to try /new. Does not kill
  # the turn (see gateway_timeout). 0 = disable. Default 300.
  # session_stall_timeout: 300

  # Transcript-sanitiser repeated-heal escalation (#96870). The pre-send
  # sanitiser silently repairs empty non-final turns on the wire copy; after
  # this many heal passes within a 10-minute session window Hermes logs one
  # ERROR (with session id + heal pattern) and sends a ONE-TIME out-of-band
  # notice to the user suggesting /debug share or `hermes doctor`. The notice
  # goes through the status channel only — conversation context and prompt
  # caching are untouched. Set 0 to disable escalation (per-window WARNINGs
  # still fire). Default 3.
  # sanitizer_heal_escalation_threshold: 3

  # Related in-agent compression timeouts (they live under the top-level
  # compression: block, shown here for discoverability next to the stall
  # watchdog they complement — a hung compression is a common stall cause):
  # compression:
  #   context_timeout_seconds: 120          # inactivity budget for in-agent
  #                                         # compress_context (0 = disable)
  #   context_total_ceiling_seconds: 600    # absolute cap on the pre-commit
  #                                         # wait even while tokens stream

  # Graceful drain timeout for gateway stop/restart (seconds).
  # Default 0 = no drain: a restart interrupts in-flight agents immediately,
  # cleans up, and exits. Set a positive value only if you want a grace
  # window on /restart, and keep it well under systemd's TimeoutStopSec.
  # restart_drain_timeout: 0

  # Floor under the same drain for cron jobs and api_server (/v1) runs
  # (seconds). Default 30.
  # restart_drain_timeout above is written for chat turns, which are cheap to
  # interrupt: the user is told the gateway is restarting and the session
  # resumes on their next message. A cron run has no such safety net — it is
  # recorded in jobs.json as a permanent failure, nobody is waiting on it, and
  # a recurring job simply skips to its next schedule. So in-flight cron work
  # gets its own grace window instead of inheriting the 0 above, and so do
  # api_server (/v1) runs: an interrupted /v1 run fails its waiting caller.
  # Clamped at runtime to the shutdown-watchdog leash (restart_drain_timeout
  # + 60s) minus teardown headroom, so values past ~50s need a matching
  # TimeoutStopSec bump to take effect. Set 0 to opt out and drain cron and
  # /v1 runs on restart_drain_timeout like before.
  # cron_drain_timeout: 30

  # In-band restart wait (seconds) for active turns to finish BEFORE stop()
  # begins. /restart and SIGUSR1 refuse new work, then wait up to this cap for
  # in-flight agent, cron and API runs to complete so the requesting turn is
  # not cut off by restart_drain_timeout. 0 = enter stop()/drain immediately.
  # Excluded from the wait: wedged runs, and cron runs already handed to a
  # worker in its own restart-safe systemd scope (they outlive the restart).
  # The default (30 min) is a safety valve for wedged agents, not a target
  # latency; raise it for long unattended turns. Env: HERMES_RESTART_AFTER_TURN_TIMEOUT.
  # restart_after_turn_timeout: 1800

  # Upper bound (seconds) a submitted prompt waits for the deferred agent
  # build (MCP discovery, model metadata, skills scan) before failing with a
  # visible error. The wait is patient — the message is delivered as soon as
  # the build completes, and a progress notice is shown past 30s — so this cap
  # only fires on a genuinely hung build. Raise it for deployments with many
  # slow or unreachable MCP servers. Default 600.
  # build_wait_timeout: 600

  # Max app-level retry attempts for API errors (connection drops, provider
  # timeouts, 5xx, etc.) before the agent surfaces the failure. Lower this
  # to 1 if you use fallback providers and want fast failover on flaky
  # primaries (default 3). The OpenAI SDK does its own low-level retries
  # underneath this wrapper — this is the Hermes-level loop.
  # api_max_retries: 3

  # Once api_max_retries AND the fallback chain are spent on a transient outage
  # (5xx, overloaded/529, connect/read timeouts) and nothing has been delivered
  # yet, Hermes waits and retries this many more cycles (jittered 15/30/60/60/60s;
  # a provider Retry-After wins, up to 120s) showing "Provider temporarily
  # unavailable — retrying automatically in Ns (cycle k/5); press Esc to stop"
  # instead of ending the turn. Auth/format/billing/policy errors never enter.
  # Set 0 to disable (default 5).
  # auto_recovery_cycles: 5

  # After the agent edits code without fresh passing verification, nudge it to
  # verify before finishing. Off by default (false). Set true to force it on
  # everywhere, or "auto" for the surface-aware mode: on for interactive
  # coding surfaces (CLI, TUI, desktop) and programmatic callers, off on
  # conversational messaging surfaces (Telegram, Discord, etc.) where the
  # verification summary would reach a human as chat noise. The
  # HERMES_VERIFY_ON_STOP env var (1/0) takes precedence.
  # verify_on_stop: false

  # Standing operator instructions for the coding posture (when Hermes is in a
  # code workspace). Appended to the coding brief as an extra system block, so
  # you can pin project-wide workflow rules without editing the shipped brief.
  # Accepts a string or a list of strings. Takes effect next session.
  # coding_instructions:
  #   - "For UI work, don't run tsc/lint until I approve the look."
  #   - "Clean the diff before you commit and push."

  # When verify-on-stop finds edited code without fresh verification evidence,
  # append guidance for creative UI work (avoid broad tsc/lint/test before visual
  # approval) and clean-diff expectations. Set false to keep that nudge terse.
  # verify_guidance: true

  # A `pre_verify` hook (plugin or shell, see Event Hooks docs) can keep the
  # agent going one more turn to verify/clean before finishing. This caps how
  # many times one turn may be nudged to continue, so a hook can't trap the loop.
  # Default 3.
  # max_verify_nudges: 3

  # Enable verbose logging
  verbose: false

  # Reasoning effort level (OpenRouter and Nous Portal)
  # Controls how much "thinking" the model does before responding.
  # Options: "xhigh" (max), "high", "medium", "low", "minimal", "none" (disable)
  # Providers with bespoke thinking tiers (a relay serving fast/thinking): use the
  # dict form and the level is sent verbatim. Bare strings stay strict (typo guard).
  #   reasoning_effort:
  #     enabled: true
  #     effort: thinking
  reasoning_effort: "medium"

  # Per-model reasoning effort overrides (optional dict)
  # Key: <redacted>
  #      provider prefix optional). First match wins.
  # Value: reasoning effort level (same options as reasoning_effort, dict form included)
  # Override the global reasoning_effort for that specific model.
  # NOTE: no `hermes config set` support for this key -- edit YAML directly.
  # reasoning_overrides:
  #   "openrouter/anthropic/claude-opus-4.5": "xhigh"
  #   "openai/gpt-5": "low"
  #   "claude-opus-4.6": "high"           # bare model name also works
  #   "deepseek/deepseek-v4-pro": "xhigh" # dots and dashes are interchangeable

  # Fast mode (OpenAI Priority Processing / xAI Grok 4.6 / Anthropic Fast Mode
  # on Opus 4.8+). Premium pricing; only sent to first-party endpoints.
  #   "" / "normal" - off (default)
  #   "fast"        - every request
  #   "auto"        - only the first fast_auto_seconds of every turn
  #   "cold"        - that window on the first turn of a session only
  # Also: /fast normal|fast|auto|cold [--global]
  service_tier: ""
  fast_auto_seconds: 60

  # Custom personalities (use with /personality command).
  # Built-ins (helpful, concise, technical, creative, teacher, kawaii, catgirl,
  # pirate, shakespeare, surfer, noir, uwu, philosopher, hype) are always
  # available on every surface — defined once in hermes_cli/personality.py.
  # Entries here ADD new personalities or OVERRIDE a built-in by name.
  # The active selection is stored in display.personality (never here, and
  # never in agent.system_prompt — that field is your manual system prompt).
  personalities: {}
  #   mentor: "You are a supportive mentor. Guide, don't lecture."
  #   reviewer:
  #     system_prompt: "You are a meticulous code reviewer."
  #     tone: "direct"
  #     style: "terse"

# =============================================================================
# Gateway Lifecycle
# =============================================================================
platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram]
  discord: [hermes-discord]
  whatsapp: [hermes-whatsapp]
  slack: [hermes-slack]
  signal: [hermes-signal]
  qqbot: [hermes-qqbot]
  yuanbao: [hermes-yuanbao]
  teams: [hermes-teams]
  google_chat: [hermes-google_chat]

# =============================================================================
# Gateway Platform Settings
# =============================================================================
# Optional per-platform messaging settings.
# Platform-specific knobs live under `extra`.
#
# platforms:
#   telegram:
#     reply_to_mode: "first"  # off | first | all
#     # guest_mode lets explicit @mentions from non-allowlisted groups through.
#     # Default false; ordinary messages, replies, and regex wake words stay blocked.
#     guest_mode: false
#     # allowed_chats: ["-1001234567890"]
#     extra:
#       drop_pending_on_cold_boot: true # Drop Telegram's queued updates on a cold boot (default). Set false on hosts that power off, so messages sent while offline are delivered on the next start; watcher reconnects always preserve them
#       disable_link_previews: false  # Set true to suppress Telegram URL previews in bot messages
#       rich_messages: false          # Bot API 10.1 rich messages (tables/task lists/details/math); default false for copyable legacy MarkdownV2, set true to opt in
#       rich_drafts: false            # Experimental rich draft previews during Telegram DM streaming; default false because Telegram Desktop/macOS can visually overlay draft frames
#       allow_cjk_rich_messages: false # Keep CJK content on the safe MarkdownV2 path unless an unaffected client explicitly opts in to native rich rendering
#       command_menu:
#         # Telegram allows up to 100 BotCommands; Hermes defaults to 60 so
#         # all built-in commands plus common skill commands stay visible
#         # while remaining under Telegram's payload-size limit. Clamped 1..100.
#         max_commands: 60
#         # prepend = user priority first, then Hermes defaults
#         # append  = Hermes defaults first, then user priority
#         # replace = only the list below defines priority
#         priority_mode: prepend
#         # Priority is applied across core + plugin + skill commands before
#         # the cap, so a listed skill command always keeps a menu slot.
#         priority:
#           - my_plugin_command
#           - my-important-skill
#   slack:
#     extra:
#       # Render live tool calls as Slack-native plan/task cards. This explicit
#       # opt-in works even though Slack text tool_progress defaults to off.
#       native_task_cards: false
#       # Slack user IDs whose Web-API posts (user token, e.g. your own
#       # dashboard/mobile front-end) count as human instead of being dropped
#       # as app traffic. Narrower than allow_bots: all. Users only — never apps.
#       api_human_users: ["U0AAAAAAA", "U0BBBBBBB"]
#       # Suppress automatic link-preview cards without removing clickable links.
#       # Omit either key to preserve Slack's default for that preview type.
#       unfurl_links: false
#       unfurl_media: false
#   webhook:
#     extra:
#       # Route scripts default to a 30 second timeout. Scripts must live under
#       # the active profile's scripts directory and receive webhook JSON on stdin.
#       script_timeout_seconds: 30
#
# Discord-specific settings (config.yaml top-level, not under platforms:):
#
# discord:
#   require_mention: true            # Require @mention in server channels (default: true)
#   bots_require_inline_mention: true  # Bot authors must type a literal @mention (default: true)
#   auto_thread: true                # Auto-create thread on @mention (default: true)
#   free_response_auto_thread: false # Free-response channels also auto-thread (default: reply inline)
#   free_response_channels: ""       # Channel IDs where no mention is needed
#   reactions: true                  # Show processing reactions (default: true)
#   history_backfill: true           # Recover missed channel messages on mention (default: true)
#   history_backfill_limit: 50       # Max messages to scan backwards (default: 50)

# ─────────────────────────────────────────────────────────────────────────────
# Available toolsets (use these names in platform_toolsets or the toolsets list)
#
# Run `hermes chat --list-toolsets` to see all toolsets and their tools.
# Run `hermes chat --list-tools` to see every individual tool with descriptions.
# ─────────────────────────────────────────────────────────────────────────────
#
# INDIVIDUAL TOOLSETS (compose your own):
#   web          - web_search, web_extract
#   search       - web_search only (no scraping)
#   terminal     - terminal, process
#   file         - read_file, write_file, patch, search
#   browser      - browser_navigate, browser_snapshot, browser_click, browser_type,
#                  browser_scroll, browser_back, browser_press,
#                  browser_get_images, browser_vision  (requires BROWSERBASE_API_KEY)
#   vision       - vision_analyze  (requires OPENROUTER_API_KEY)
#   image_gen    - image_generate  (requires FAL_KEY)
#   skills       - skills_list, skill_view
#   skills_hub   - skill_hub (search/install/manage from online registries — user-driven only)
#   todo         - todo (in-memory task planning, no deps)
#   tts          - text_to_speech  (Edge TTS free, or ELEVENLABS/OPENAI/MINIMAX/MISTRAL key)
#   cronjob      - cronjob (create/list/update/pause/resume/run/remove scheduled tasks)
#
# PRESETS (curated bundles):
#   hermes-cli       - All of the above except send_message
#   hermes-telegram  - terminal, file, web, vision, image_gen, tts, browser,
#                      skills, todo, cronjob, send_message
#   hermes-discord   - Same as hermes-telegram
#   hermes-whatsapp  - Same as hermes-telegram
#   hermes-slack     - Same as hermes-telegram
#
# COMPOSITE:
#   debugging    - terminal + web + file
#   safe         - web + vision (no terminal access)
#   all          - Everything available
#
#   web          - Web search and content extraction (web_search, web_extract)
#   search       - Web search only, no scraping (web_search)
#   terminal     - Command execution and process management (terminal, process)
#   file         - File operations: read, write, patch, search
#   browser      - Full browser automation (navigate, click, type, screenshot, etc.)
#   vision       - Image analysis (vision_analyze)
#   image_gen    - Image generation with FLUX (image_generate)
#   skills       - Load skill documents (skills_list, skill_view)
#   todo         - Task planning and tracking for multi-step work
#   memory       - Persistent memory across sessions (personal notes + user profile)
#   session_search - Search and recall past conversations (FTS5 + Gemini Flash summarization)
#   tts          - Text-to-speech (Edge TTS free, ElevenLabs, OpenAI, MiniMax, Mistral)
#   cronjob      - Schedule and manage automated tasks (CLI-only)
#
# Composite toolsets:
#   debugging    - terminal + web + file (for troubleshooting)
#   safe         - web + vision (no terminal access)

# NOTE: The top-level "toolsets" key is deprecated and ignored.
# Tool configuration is managed per-platform via platform_toolsets above.
# Use `hermes tools` to configure interactively, or edit platform_toolsets directly.
#
# CLI override: hermes chat --toolsets terminal,web,file

# =============================================================================
# MCP (Model Context Protocol) Servers
# =============================================================================
# Connect to external MCP servers to add tools from the MCP ecosystem.
# Each server's tools are automatically discovered and registered.
# See website/docs/user-guide/features/mcp.md for full documentation.
#
# Stdio servers (spawn a subprocess):
#   command: the executable to run
#   args: command-line arguments
#   env: environment variables (only these + safe defaults passed to subprocess)
#
# HTTP servers (connect to a URL):
#   url: the MCP server endpoint
#   headers: HTTP headers (e.g., for authentication)
#
# Optional per-server settings:
#   timeout: tool call timeout in seconds (default: 120)
#   connect_timeout: initial connection timeout (default: 60)
#   keepalive_interval: liveness ping cadence in seconds (floored at 5s).
#     HTTP servers default to 180s; lower it below the server's session TTL for
#     servers that expire idle sessions quickly (e.g. Unreal Engine editor MCP,
#     ~15s), otherwise idle tool calls hit an expired session and pay a slow
#     reconnect. Stdio servers disable keepalive by default; set this explicitly
#     to opt a stdio server in.
#   lazy: register the server's tools from the on-disk schema cache at startup
#     and only spawn/connect it on the first tool call (default: false). Saves
#     one child process per server in processes that rarely call tools. Needs
#     one prior live connect to populate the cache; a missing or stale cache
#     entry falls back to the normal eager connect. The banner and the TUI show
#     such a server as "lazy" with its cached tool count until it is first used.
#
# mcp_servers:
#   time:
#     command: uvx
#     args: ["mcp-server-time"]
#   filesystem:
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/user"]
#   notion:
#     url: https://mcp.notion.com/mcp
#   github:
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-github"]
#     env:
#       GITHUB_PERSONAL_ACCESS_TOKEN: <redacted>
#
# Sampling (server-initiated LLM requests) — enabled by default.
# Per-server config under the 'sampling' key:
#   analysis:
#     command: npx
#     args: ["-y", "analysis-server"]
#     sampling:
#       enabled: true           # default: true
#       model: "gemini-3-flash" # override model (optional)
#       max_tokens_cap: <redacted>
#       timeout: 30             # LLM call timeout (seconds)
#       max_rpm: 10             # max requests per minute
#       allowed_models: []      # model whitelist (empty = all)
#       max_tool_rounds: 5      # tool loop limit (0 = disable)
#       expose_client_tools: false # advertise extended sampling.tools capability
#       log_level: "info"       # audit verbosity

# =============================================================================
# Text-to-Speech
# =============================================================================
# TTS defaults to Edge TTS unless changed in ~/.hermes/config.yaml.
# Gemini TTS supports persona/director prompt files, and Gemini 3.1 Flash TTS
# can use a hidden auxiliary rewrite pass to insert expressive square-bracket
# audio tags into the TTS script without showing tags in chat.
#
# tts:
#   provider: "gemini"
#   speed: 1.0              # global speed multiplier (provider-specific overrides this)
#   # Per-platform audio upload limits. Built-in defaults: discord 10 MiB,
#   # telegram 50 MiB, everything else 10 MiB, each with safety_ratio 0.85
#   # (the fraction of max_file_bytes actually targeted). Override per platform:
#   delivery_profiles:
#     telegram:
#       max_file_bytes: 52428800
#       safety_ratio: 0.85
#   gemini:
#     model: "gemini-3.1-flash-tts-preview"
#     voice: "Kore"
#     audio_tags: false
#     persona_prompt_file: ""  # e.g. ~/.hermes/tts/radio-host.md
#   xai:
#     voice_id: "eve"       # built-in or custom voice ID from xAI Console
#     language: "en"        # BCP-47 code ("en", "pt-BR") or "auto"
#     speed: 1.0            # 0.7-1.5 playback speed
#     auto_speech_tags: false  # insert expressive audio tags via LLM rewrite
#     text_normalization: false  # normalize numbers/abbreviations/symbols
#     optimize_streaming_latency: 0  # 0-2, trades quality for lower latency
#     sample_rate: 24000    # 22050 / 24000 / 44100 / 48000
#     bit_rate: 128000      # MP3 bitrate (codec=mp3 only)

# =============================================================================
# Voice Transcription (Speech-to-Text)
# =============================================================================
# Automatically transcribe voice messages on messaging platforms.
# Providers: local (free, faster-whisper) | groq (free tier) | openai (Whisper API) | mistral (Voxtral Transcribe)
# Set the corresponding API key in .env: <redacted>
delegation:
  max_iterations: 250                         # Max tool-calling turns per child (default: 250)
  # max_concurrent_children: 10               # Max parallel child agents per batch (default: 10, floor: 1, no ceiling).
                                              # WARNING: values above 10 multiply API cost linearly.
  # max_spawn_depth: 1                        # Delegation tree depth cap (range: 1-3, default: 1 = flat).
                                              # Raise to 2 to allow workers to spawn their own subagents.
                                              # Requires role="orchestrator" on intermediate agents.
  # orchestrator_enabled: true                # Kill switch for role="orchestrator" children (default: true).
  # subagent_auto_approve: false              # When a subagent hits a dangerous-command approval prompt, auto-deny (default: false)
                                              # or auto-approve "once" (true) instead of blocking on stdin.
                                              # The parent TUI owns stdin, so blocking would deadlock; non-interactive resolution is required.
                                              # Both choices emit a logger.warning audit line. Flip to true only for cron/batch pipelines.
  # inherit_mcp_toolsets: true                # When explicit child toolsets are narrowed, also keep the parent's MCP toolsets (default: true). Set false for strict intersection.
  # model: "google/gemini-3-flash-preview"    # Override model for subagents (empty = inherit parent)
  # provider: "openrouter"                    # Override provider for subagents (empty = inherit parent)
  #                                           # Resolves full credentials (base_url, api_key) automatically.
  #                                           # Supported: openrouter, nous, zai, kimi-coding, minimax
  #                                           # Cost tip: keep the parent on a frontier model and pin
  #                                           # delegation.model to an inexpensive one — children carry the
  #                                           # vast majority of tokens, so this is where spend is cut while
  #                                           # planning quality stays with the frontier parent.
  # fallback_providers:                       # Fallback chain for delegated children (same entry format as the
  #   - provider: "openrouter"                # top-level list). Pinned children use only a declared child chain;
  #     model: "deepseek/deepseek-chat"       # unpinned children inherit when unset. [] disables fallback (#65038).

# =============================================================================
